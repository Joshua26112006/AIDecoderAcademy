<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom — Skeleton Wireframe v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="classroom-v2.css">
</head>
<body>

<div class="page">

  <!-- REGION 1 — CHAPTER HEADER -->
  <header class="region region--header">
    <span class="region__tag">1 · Chapter Header</span>
    <span class="region__note">Chapter title · progress · context</span>
  </header>

  <!-- REGION 2 — THREE-COLUMN WORKSPACE -->
  <div class="workspace">

    <section class="region region--left">
      <span class="region__tag">2a · Learning Journey</span>
      <span class="region__hint">≈18%</span>
    </section>

    <section class="region region--center">
      <span class="region__tag region__tag--lg">2b · AI Learning Canvas</span>
      <span class="region__hint">≈60% · dominant region</span>
    </section>

    <section class="region region--right">
      <span class="region__tag">2c · My Creations</span>
      <span class="region__hint">≈22%</span>
    </section>

  </div>

  <!-- REGION 3 — AI CHAT INPUT -->
  <section class="region region--chat">
    <span class="region__tag">3 · AI Chat Input</span>
  </section>

  <!-- REGION 4 — DOCK ROW: reserved · dock (canvas-aligned) · reserved -->
  <div class="dock-row">

    <!-- reserved for AI Teacher (not designed yet) -->
    <div class="dock-slot dock-slot--reserved">
      <span class="region__hint">AI Teacher</span>
    </div>

    <!-- output dock — aligned to canvas width -->
    <section class="region region--dock">
      <span class="region__tag">4 · Output Generation Dock</span>
    </section>

    <!-- reserved for Dustbin (not designed yet) -->
    <div class="dock-slot dock-slot--reserved">
      <span class="region__hint">Dustbin</span>
    </div>

  </div>

</div>

</body>
</html>
