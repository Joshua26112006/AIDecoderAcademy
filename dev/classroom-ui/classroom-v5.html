<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom — Learning Journey v5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="classroom-v5.css">
</head>
<body>

<div class="page">

  <!-- ====================================================================
       TOP STRIP — compact chapter header + learning journey (one area)
       ==================================================================== -->
  <div class="topbar">

  <header class="page-header">
    <h1 class="page-header__title">Real Numbers</h1>
    <span class="page-header__subtitle">CBSE Class 10 • Mathematics</span>
  </header>

  <!-- LEARNING JOURNEY (arrow chevrons, linked by glowing connector nodes) -->
  <header class="journey">
    <nav class="journey__track" aria-label="Learning journey">

      <label class="phase">
        <input type="radio" name="phase" class="phase__radio" id="p-engagement">
        <span class="phase__inner">
          <span class="phase__badge">1</span>
          <span class="phase__text">
            <span class="phase__step">Phase 01</span>
            <span class="phase__title">Engagement</span>
          </span>
        </span>
      </label>

      <label class="phase">
        <input type="radio" name="phase" class="phase__radio" id="p-exploration">
        <span class="phase__inner">
          <span class="phase__badge">2</span>
          <span class="phase__text">
            <span class="phase__step">Phase 02</span>
            <span class="phase__title">Exploration</span>
          </span>
        </span>
      </label>

      <label class="phase">
        <input type="radio" name="phase" class="phase__radio" id="p-understanding" checked>
        <span class="phase__inner">
          <span class="phase__badge">3</span>
          <span class="phase__text">
            <span class="phase__step">Phase 03</span>
            <span class="phase__title">Understanding</span>
          </span>
        </span>
      </label>

      <label class="phase">
        <input type="radio" name="phase" class="phase__radio" id="p-thinking">
        <span class="phase__inner">
          <span class="phase__badge">4</span>
          <span class="phase__text">
            <span class="phase__step">Phase 04</span>
            <span class="phase__title">Thinking Process</span>
          </span>
        </span>
      </label>

      <label class="phase">
        <input type="radio" name="phase" class="phase__radio" id="p-mastery">
        <span class="phase__inner">
          <span class="phase__badge">5</span>
          <span class="phase__text">
            <span class="phase__step">Phase 05</span>
            <span class="phase__title">Mastery</span>
          </span>
        </span>
      </label>

      <label class="phase">
        <input type="radio" name="phase" class="phase__radio" id="p-retention">
        <span class="phase__inner">
          <span class="phase__badge">6</span>
          <span class="phase__text">
            <span class="phase__step">Phase 06</span>
            <span class="phase__title">Retention</span>
          </span>
        </span>
      </label>

    </nav>

    <!-- timeline rail below the arrows: connecting line + a dot under each phase -->
    <div class="journey__rail" aria-hidden="true">
      <span class="rail-dot"></span>
      <span class="rail-dot"></span>
      <span class="rail-dot"></span>
      <span class="rail-dot"></span>
      <span class="rail-dot"></span>
      <span class="rail-dot"></span>
    </div>
  </header>

  </div><!-- /.topbar -->

  <!-- ====================================================================
       WORKSPACE — Library · Canvas · Tool rail  (unchanged from v3)
       ==================================================================== -->
  <div class="workspace">

    <!-- LEFT — Learning Library (empty) + Dustbin foot -->
    <aside class="side side--left">
      <section class="region side__main">
        <span class="region__tag">Learning Library</span>
      </section>
      <div class="side__foot">
        <span class="region__hint">Dustbin</span>
      </div>
    </aside>

    <!-- CENTER — AI Learning Canvas (workspace + chat; no title section) -->
    <section class="canvas">
      <div class="canvas__content">
        <!-- subtle contextual indicator of the active AI tool / generation mode -->
        <span class="canvas__mode" aria-live="polite"><span class="canvas__mode-dot"></span></span>
        <!-- subtle contextual indicator of the current learning phase -->
        <span class="canvas__phase" aria-live="polite">
          <span class="canvas__phase-label">Current Learning Phase</span>
          <span class="canvas__phase-name"></span>
        </span>
        <span class="region__tag region__tag--lg">AI Learning Canvas</span>
        <span class="region__hint">dominant content area</span>
      </div>
      <div class="canvas__chat">
        <span class="region__tag">AI Chat Input</span>
        <span class="region__hint">anchored inside canvas</span>
      </div>
    </section>

    <!-- RIGHT — narrow gamified AI Tools toolbox + AI Teacher foot -->
    <aside class="rail">
      <span class="rail__eyebrow">AI Tools</span>

      <div class="rail__body">

        <label class="tool" style="--tc:#3b82f6;">
          <input type="radio" name="tool" class="tool__radio" id="t-flashcards" checked>
          <span class="tool__label">Flashcards</span>
        </label>

        <label class="tool" style="--tc:#10b981;">
          <input type="radio" name="tool" class="tool__radio" id="t-mindmaps">
          <span class="tool__label">Mind Maps</span>
        </label>

        <label class="tool" style="--tc:#f59e0b;">
          <input type="radio" name="tool" class="tool__radio" id="t-blogs">
          <span class="tool__label">Blogs</span>
        </label>

        <label class="tool" style="--tc:#2563eb;">
          <input type="radio" name="tool" class="tool__radio" id="t-videos">
          <span class="tool__label">Explainer Videos</span>
        </label>

        <label class="tool" style="--tc:#ec4899;">
          <input type="radio" name="tool" class="tool__radio" id="t-comic">
          <span class="tool__label">Comic Creations</span>
        </label>

        <label class="tool" style="--tc:#06b6d4;">
          <input type="radio" name="tool" class="tool__radio" id="t-audioov">
          <span class="tool__label">Audio Overview</span>
        </label>

        <label class="tool" style="--tc:#8b5cf6;">
          <input type="radio" name="tool" class="tool__radio" id="t-infographic">
          <span class="tool__label">Infographic</span>
        </label>

        <label class="tool" style="--tc:#f97316;">
          <input type="radio" name="tool" class="tool__radio" id="t-podcast">
          <span class="tool__label">Audio Podcast</span>
        </label>

        <label class="tool" style="--tc:#7c3aed;">
          <input type="radio" name="tool" class="tool__radio" id="t-notes">
          <span class="tool__label">Notes</span>
        </label>

      </div>
    </aside>

  </div>

</div>

</body>
</html>
